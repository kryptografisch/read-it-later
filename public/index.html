<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>read-it-later PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />
    <meta name="theme-color" content="#000000" />

    <meta name="description" content="Read It Later PWA" />
    <meta name="robots" content="noodp" />
    <meta name="author" content="kryptograFisch" />
    <meta
      name="keywords"
      content="ril read-it-later read it later readitlater"
    />

    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker &&
            navigator.serviceWorker.register("./service-worker.js");
        });
      }
    </script>
  </head>

  <body>
    <header>
      <div class="content main">
        <h1>read-it-later pwa</h1>
      </div>
    </header>

    <section>
      <div class="content">
        <div id="preinstall" class="alert alert-info" role="alert">
          <div class="preinstall-wrap">
            <div>ℹ️</div>
            <div>
              Make full use of this PWA - open your browser menu and click
              <span>install app</span> 📱
            </div>
          </div>
          <small>Hint: Currently only supported in Chrome for Android</small>
        </div>
        <div class="content-header">
          <h2 id="what">Your links for later</h2>

          <button type="button" class="btn btn-light" data-bs-toggle="modal" data-bs-target="#modal">
            + add
          </button>
        </div>
        <p id="loading" class="d-block">loading your items...</p>
        <div id="content-container" class="d-none">
          
        </div>
        <div id="template_placeholder">
          <ul
            class="list-group list-group-horizontal pt-3 "
            data-index="-1"
          >
            <li
              class="list-group-item col col-text"
              onclick="select(this)"
              onmouseout="unselect(this)"
            >
              <div class="entry-date">__date__</div>
              <div>__title__</div>
              <a href="" class="edit" onclick="editEntry()">📝</a>
            </li>
            <li class="list-group-item col-1 entry-link">
              <a href="__link__" target="_blank">🔗</a>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <div class="modal fade" id="modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add a new link manually</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="entry-form">
                <div class="mb-3">
                  <label for="form-title" class="form-label">Title</label>
                  <input type="text" class="form-control" id="form-title">
                </div>
                <div class="mb-3">
                  <label for="form-link" class="form-label">Link</label>
                  <textarea type="text" class="form-control" id="form-link"></textarea>
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">cancel</button>
            <button type="button" class="btn btn-primary" onclick="addNewEntry()">add</button>
          </div>
        </div>
      </div>

    <footer>
      <div class="content">
        <code id="debug">nothing to debug</code>
      </div>
    </footer>

    <script defer src="./bootstrap.bundle.min.js"></script>
    <script defer src="./main.js"></script>
  </body>
</html>
